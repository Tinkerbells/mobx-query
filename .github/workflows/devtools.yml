name: mobx-query-devtools

on:
  pull_request:
    paths: &paths
      - 'packages/devtools/**'
      - 'packages/mobx-query/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/devtools.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tinkerbells88/mobx-query run build
      - run: pnpm --filter @tinkerbells88/mobx-query-devtools run lint:types
      - run: pnpm --filter @tinkerbells88/mobx-query-devtools run build
      - run: pnpm --filter @tinkerbells88/mobx-query-devtools run tests

  publish:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # @semantic-release/npm validates pkgRoot before its prepare hook, so the
      # publishable manifest must exist in this clean checkout first.
      - run: pnpm --filter @tinkerbells88/mobx-query run build
      - run: pnpm --filter @tinkerbells88/mobx-query-devtools run build
      - run: pnpm run release:devtools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
